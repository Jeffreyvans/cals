# Render blueprint for EduSphere.
#
# Secrets are never stored in this repository: every key marked sync: false is
# typed into the Render dashboard once. SECRET_KEY is generated by Render.
#
# Docs: DEPLOY.md
services:
  - type: web
    name: edusphere
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --config gunicorn.conf.py
    healthCheckPath: /health/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: GUNICORN_THREADS
        value: "2"
      - key: GUNICORN_TIMEOUT
        value: "60"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true

      # The main platform administrator. Values are typed into the dashboard,
      # never committed. Set PLATFORM_ADMIN_RESET_PASSWORD to true for one
      # deploy when the password must be replaced.
      - key: PLATFORM_ADMIN_USERNAME
        sync: false
      - key: PLATFORM_ADMIN_EMAIL
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false
      - key: PLATFORM_ADMIN_RESET_PASSWORD
        value: "false"
      - key: PLATFORM_ADMIN_FORCE_CHANGE
        value: "true"

      # PostgreSQL (Render, Supabase session pooler, Neon, ...).
      - key: DATABASE_URL
        sync: false

      # Redis is optional. Without it the process-local cache is used and
      # imports, exports and newsletters run inline. With REDIS_URL set, the
      # same URL is the Celery broker; add the worker service described in
      # DEPLOY.md (or set CELERY_BROKER_URL explicitly).
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false

      # Email through the Mailjet HTTPS API (django-anymail). Render blocks
      # outbound SMTP, so no SMTP variables exist. Brevo and Resend remain
      # selectable with EMAIL_PROVIDER. All secrets use sync: false.
      - key: EMAIL_PROVIDER
        value: mailjet
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_SECRET_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SERVER_EMAIL
        sync: false
      - key: DEFAULT_REPLY_TO_EMAIL
        sync: false
      - key: EMAIL_FROM_DOMAIN
        sync: false
      - key: SITE_URL
        sync: false
      - key: MAILJET_WEBHOOK_SECRET
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false

      # Uploaded logos and documents: Supabase Storage, Cloudflare R2 or
      # Backblaze B2 over the S3 API. Leave STORAGE_BACKEND blank for local
      # disk, which is NOT durable on Render's free plan.
      - key: STORAGE_BACKEND
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: AWS_S3_CUSTOM_DOMAIN
        sync: false
      - key: AWS_LOCATION
        sync: false
