[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["__pycache__", "migrations", "staticfiles", ".venv", ".venv*", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["E501", "DJ001"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "academics", "finance", "fiscalisation", "lms", "config", "core", "ai", "admissions", "operations", "library", "health", "counselling", "student_affairs", "sports", "boarding", "transport", "catering", "careers", "examinations", "research", "labs", "ict_helpdesk", "api", "platform_admin"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-v --tb=short"
testpaths = ["accounts", "academics", "finance", "fiscalisation", "admissions", "lms", "operations", "library", "health", "counselling", "student_affairs", "sports", "boarding", "transport", "catering", "careers", "examinations", "research", "labs", "ict_helpdesk", "api", "platform_admin", "ai", "config", "core", "tests"]
filterwarnings = ["ignore::RuntimeWarning"]

[tool.coverage.run]
source = ["accounts", "academics", "finance", "fiscalisation", "admissions", "lms", "operations", "library", "health", "counselling", "student_affairs", "sports", "boarding", "transport", "catering", "careers", "examinations", "research", "labs", "ict_helpdesk", "api", "platform_admin", "ai", "config", "core"]
omit = ["*/migrations/*", "*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

