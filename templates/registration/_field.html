{% if field.field.widget.input_type == "hidden" %}
  {{ field }}
{% else %}
  <div class="field{% if field.errors %} field-error{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span aria-hidden="true">*</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<p class="help">{{ field.help_text }}</p>{% endif %}
    {% for error in field.errors %}<p class="field-message" role="alert">{{ error }}</p>{% endfor %}
  </div>
{% endif %}
