{% extends "public_base.html" %}{% load branding %}
{% block title %}Password changed — {% brand_name %}{% endblock %}
{% block content %}
<div class="page-shell narrow">
  <div class="page-title">
    <h1>Password changed</h1>
    <p>Your new password is ready. Sign in with it now.</p>
  </div>
  <div class="panel">
    <div class="alert alert-ok" role="status">The change was saved.</div>
    <p style="margin-top: 1.2rem;"><a class="btn" href="{% url 'login' %}">Sign in</a></p>
  </div>
</div>
{% endblock %}
