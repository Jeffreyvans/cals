<div class="filters hierarchy-filters">
  {% for key, value in other_params %}<input type="hidden" name="{{ key }}" value="{{ value }}">{% endfor %}
  <label>School / faculty
    <select name="school">
      <option value="">All</option>
      {% for row in schools %}<option value="{{ row.pk }}" {% if hierarchy_filters.school == row.pk|stringformat:'s' %}selected{% endif %}>{{ row.name }}</option>{% endfor %}
    </select>
  </label>
  {% if not hide_department %}
  <label>Department
    <select name="department">
      <option value="">All</option>
      {% for row in departments %}<option value="{{ row.pk }}" {% if hierarchy_filters.department == row.pk|stringformat:'s' %}selected{% endif %}>{{ row.name }}</option>{% endfor %}
    </select>
  </label>
  {% endif %}
  <label>Level
    <select name="level">
      <option value="">All</option>
      {% for row in levels %}<option value="{{ row.pk }}" {% if hierarchy_filters.level == row.pk|stringformat:'s' %}selected{% endif %}>{{ row.name }}</option>{% endfor %}
    </select>
  </label>
  <label>Class
    <select name="school_class">
      <option value="">All</option>
      {% for row in classes %}<option value="{{ row.pk }}" {% if hierarchy_filters.class == row.pk|stringformat:'s' %}selected{% endif %}>{{ row.name }}</option>{% endfor %}
    </select>
  </label>
  <button class="btn ghost btn-sm">Filter</button>
  <a class="btn ghost btn-sm" href="?">Clear</a>
</div>
