{% extends "base.html" %}{% block content %}
<h1>Expenses</h1>
<p><a class="btn" href="{% url 'expense_create' %}">New expense</a></p>
<table class="tbl"><tr><th>Date</th><th>Description</th><th>Category</th><th>Supplier</th><th class="r">Amount</th></tr>
{% for e in rows %}<tr><td>{{ e.date }}</td><td>{{ e.description }}</td><td>{{ e.category }}</td>
<td>{{ e.supplier|default:"-" }}</td><td class="r">{{ CUR }}{{ e.amount }}</td></tr>
{% empty %}<tr><td colspan="5" class="muted">No expenses yet.</td></tr>{% endfor %}</table>
{% endblock %}
