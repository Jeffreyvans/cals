{% extends "base.html" %}{% block content %}
<h1>Pay online</h1>
<p>{{ invoice.student.name }} · {{ invoice.description }}</p>
<p>Outstanding: <b>{{ invoice.institution.currency }} {{ invoice.balance }}</b></p>
<form method="post" data-idempotent>{% csrf_token %}
<input type="hidden" name="idempotency_key" value="{{ idempotency_key|default:'' }}">
<label>Amount <input type="number" name="amount" step="0.01" min="0.01" value="{{ invoice.balance }}"></label>
<button class="btn">Continue to Paynow</button></form>
{% endblock %}
